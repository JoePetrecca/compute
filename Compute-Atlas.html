<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Compute Atlas · Local → ICER</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d1d1f;
      --muted: #77777f;
      --line: #e3e4e8;
      --blue: #0071e3;
      --cpu: #dfeeff;
      --cpu-stroke: #a9c8ef;
      --gpu: #eee7ff;
      --gpu-stroke: #c7b7e5;
      --ram: #e4f2e9;
      --ram-stroke: #b4d2bd;
      --npu: #ffecdf;
      --npu-stroke: #e7c5ac
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      color: var(--ink);
      background: #fff;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden
    }

    button,
    input {
      font: inherit
    }

    button {
      color: inherit;
      cursor: pointer;
      background: #fff;
      border: 1px solid #dddfe4;
      border-radius: 9px;
      padding: 7px 12px
    }

    button:hover {
      background: #f1f3f7
    }

    button:focus-visible,
    input:focus-visible,
    summary:focus-visible {
      outline: 3px solid #79b7f6;
      outline-offset: 3px
    }

    button:disabled {
      opacity: .3;
      cursor: default
    }

    [hidden] {
      display: none !important
    }

    .app {
      height: 100%;
      display: grid;
      grid-template-columns: 278px minmax(0, 1fr)
    }

    aside {
      height: 100%;
      background: #f5f5f7;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-width: 0
    }

    .side-head {
      padding: 25px 21px 14px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -.8px
    }

    .brand svg {
      width: 24px;
      height: 24px
    }

    .side-sub {
      font-size: 11px;
      color: var(--muted);
      margin: 3px 0 18px
    }

    .search {
      width: 100%;
      border: 1px solid #dedfe4;
      background: #eaeaec;
      border-radius: 9px;
      padding: 9px 12px;
      color: var(--ink);
      font-size: 12px
    }

    .filters {
      display: flex;
      gap: 4px;
      padding: 3px;
      margin-top: 10px;
      border-radius: 9px;
      background: #e6e6e9
    }

    .filters button {
      flex: 1;
      border: 0;
      background: transparent;
      padding: 5px;
      font-size: 11px;
      color: #62626a;
      border-radius: 6px
    }

    .filters button.active {
      background: #fff;
      color: #1d1d1f;
      box-shadow: 0 1px 3px #0001
    }

    .profiles {
      overflow: auto;
      flex: 1;
      padding: 0 12px 16px;
      scrollbar-width: thin;
      scrollbar-color: #cccdd2 transparent
    }

    .group {
      margin: 0 0 10px
    }

    .group summary {
      cursor: pointer;
      color: #85858e;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .7px;
      text-transform: uppercase;
      padding: 9px 9px 6px;
      list-style: none;
      display: flex;
      justify-content: space-between
    }

    .group summary::after {
      content: '⌄';
      font-size: 12px
    }

    .group:not([open]) summary::after {
      content: '›'
    }

    .profile {
      display: flex;
      text-align: left;
      gap: 10px;
      align-items: center;
      padding: 10px 10px;
      width: 100%;
      background: transparent;
      border: 0;
      border-radius: 9px;
      margin: 1px 0;
      transition: background .15s
    }

    .profile:hover {
      background: #e9eaee
    }

    .profile.active {
      background: #e1ebfa;
      color: #075bc0
    }

    .profile .p-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border-radius: 7px;
      background: #e2e7ed;
      color: #62738b
    }

    .profile.active .p-icon {
      background: #c9def8;
      color: #246aa8
    }

    .p-icon svg {
      width: 18px;
      height: 18px
    }

    .profile strong {
      display: block;
      font-size: 12px;
      font-weight: 550;
      line-height: 1.4
    }

    .profile small {
      display: block;
      color: #85858f;
      font-size: 10px;
      margin-top: 2px
    }

    .profile.active small {
      color: #6087b5
    }

    .side-footer {
      padding: 12px 21px;
      border-top: 1px solid #e3e3e8;
      color: #8b8b94;
      font-size: 10px;
      display: flex;
      justify-content: space-between
    }

    .empty {
      color: #7e7e88;
      font-size: 12px;
      padding: 20px 10px
    }

    main {
      min-width: 0;
      height: 100%;
      display: grid;
      grid-template-rows: auto auto minmax(250px, 1fr) auto;
      padding: 28px 38px 20px;
      overflow: auto
    }

    .main-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #8a8a93;
      margin-bottom: 7px
    }

    h1 {
      font-size: clamp(25px, 2.8vw, 39px);
      line-height: 1.18;
      font-weight: 550;
      letter-spacing: -1.35px;
      margin: 0 0 7px
    }

    .meta {
      color: #83838c;
      font-size: 12px;
      min-height: 19px
    }

    .head-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
      padding-top: 2px
    }

    .head-actions button {
      font-size: 12px;
      color: #6c6c75;
      padding: 7px 10px;
      background: #fafafa
    }

    .head-actions .info {
      width: 32px;
      height: 32px;
      padding: 0;
      font-family: Georgia, serif;
      font-weight: bold;
      font-size: 15px
    }

    .settings {
      min-height: 47px;
      display: flex;
      align-items: center;
      gap: 18px;
      margin-top: 12px;
      flex-wrap: wrap
    }

    .settings label {
      font-size: 12px;
      color: #696972;
      cursor: pointer;
      white-space: nowrap
    }

    .settings input {
      accent-color: var(--blue);
      vertical-align: middle;
      margin: 0 5px 2px 0
    }

    .settings .architecture {
      font-size: 10px;
      color: #86868e;
      border: 1px solid #e1e2e6;
      border-radius: 99px;
      padding: 3px 9px;
      margin-right: auto
    }

    .settings .local-hint {
      font-size: 10px;
      color: #9a9aa3
    }

    .stage {
      position: relative;
      min-height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      isolation: isolate
    }

    .stage svg {
      width: 100%;
      height: 100%;
      max-width: 1100px;
      max-height: 680px;
      display: block;
      overflow: visible
    }

    .diagram-enter {
      animation: appear .25s ease both
    }

    @keyframes appear {
      from {
        opacity: .1;
        transform: translateY(4px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .diagram-frame {
      fill: #fafbfc;
      stroke: #dfe3e9;
      stroke-width: 1.4
    }

    .cpu-box {
      fill: var(--cpu);
      stroke: var(--cpu-stroke)
    }

    .gpu-box {
      fill: var(--gpu);
      stroke: var(--gpu-stroke)
    }

    .ram-box {
      fill: var(--ram);
      stroke: var(--ram-stroke)
    }

    .npu-box {
      fill: var(--npu);
      stroke: var(--npu-stroke)
    }

    .block {
      stroke-width: 1.4;
      transition: stroke .2s, filter .2s
    }

    .component {
      cursor: pointer;
      outline: none
    }

    .component:hover>.block,
    .component:focus-visible>.block {
      stroke: #718eae;
      stroke-width: 2
    }

    .component.selected>.block {
      stroke: #5385be;
      stroke-width: 2.3;
      filter: drop-shadow(0 3px 8px #41688b13)
    }

    svg text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      pointer-events: none
    }

    .diagram-title {
      font-size: 29px;
      font-weight: 550;
      letter-spacing: -.6px;
      fill: #293648
    }

    .diagram-sub {
      font-size: 17px;
      fill: #6c788a
    }

    .diagram-note {
      font-size: 14px;
      fill: #939ba7
    }

    .diagram-small {
      font-size: 13px;
      fill: #778598
    }

    .wire {
      fill: none;
      stroke: #a9b5c4;
      stroke-width: 2;
      stroke-linejoin: round;
      stroke-linecap: round
    }

    .gpu-wire {
      stroke: #b5a4ce
    }

    .badge-text {
      font-size: 13px;
      fill: #8a94a1;
      letter-spacing: 1px
    }

    .role-icon {
      fill: none;
      stroke: #7e9fc4;
      stroke-width: 1.8
    }

    .gpu-icon {
      stroke: #a38bc4
    }

    .npu-icon {
      stroke: #bf9c7f
    }

    .footer {
      border-top: 1px solid #ececf0;
      padding-top: 15px;
      margin-top: 10px
    }

    .caption {
      display: flex;
      gap: 13px;
      align-items: baseline;
      min-height: 33px
    }

    .caption strong {
      font-size: 14px;
      font-weight: 550;
      white-space: nowrap
    }

    .caption span {
      font-size: 13px;
      color: #7c7c86
    }

    .bottomline {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: #a0a0a8;
      font-size: 10px;
      margin-top: 8px
    }

    .legend {
      display: flex;
      gap: 11px;
      flex-wrap: wrap
    }

    .legend i {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 2px;
      margin-right: 4px;
      background: var(--color)
    }

    .pager {
      display: flex;
      gap: 5px
    }

    .pager button {
      border: 0;
      font-size: 16px;
      line-height: 1;
      background: transparent;
      padding: 1px 4px;
      color: #7c7c87
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 15px
    }

    .node-count {
      color: #9898a1;
      font-size: 10px
    }

    dialog {
      width: min(800px, 92vw);
      max-height: 85vh;
      overflow: auto;
      border: 1px solid #dddfe5;
      border-radius: 20px;
      padding: 28px;
      color: #2b2b33;
      background: #fff;
      box-shadow: 0 25px 100px #0002
    }

    dialog::backdrop {
      background: #242b3745;
      backdrop-filter: blur(7px)
    }

    dialog h2 {
      font-size: 27px;
      font-weight: 550;
      letter-spacing: -.7px;
      margin: 0 0 7px
    }

    dialog h3 {
      font-size: 14px;
      margin-top: 24px;
      font-weight: 600
    }

    dialog p {
      font-size: 12px;
      color: #757580;
      line-height: 1.7
    }

    dialog a {
      color: #006bd3
    }

    dialog .close {
      float: right;
      padding: 3px 10px;
      border: 0;
      font-size: 23px
    }

    dialog table {
      border-collapse: collapse;
      width: 100%;
      font-size: 12px;
      margin: 18px 0
    }

    dialog td {
      padding: 8px 6px;
      border-bottom: 1px solid #eeeef2;
      color: #61616c
    }

    dialog td:first-child {
      width: 35%;
      color: #9999a2
    }

    dialog .source {
      padding: 10px 0;
      border-top: 1px solid #ececf0
    }

    dialog .source a {
      font-size: 12px
    }

    kbd {
      font-size: 10px;
      padding: 1px 4px;
      border: 1px solid #e0e1e6;
      border-radius: 4px
    }

    .presentation .app {
      grid-template-columns: 230px minmax(0, 1fr)
    }

    .presentation main {
      padding: 20px 35px 18px
    }

    .presentation h1 {
      font-size: 38px
    }

    .presentation .caption strong {
      font-size: 18px
    }

    .presentation .caption span {
      font-size: 16px
    }

    .presentation .side-head {
      padding: 20px 15px 10px
    }

    .presentation .search,
    .presentation .filters,
    .presentation .side-sub {
      display: none
    }

    .presentation .profile strong {
      font-size: 13px
    }

    .presentation .bottomline {
      font-size: 11px
    }

    .presentation .diagram-title {
      font-size: 32px
    }

    .presentation .diagram-sub {
      font-size: 19px
    }

    .presentation .diagram-note {
      font-size: 16px
    }

    .presentation .diagram-small {
      font-size: 15px
    }

    .presentation .settings {
      margin-top: 8px
    }

    .presentation .node-count {
      display: none
    }

    .mobile-menu {
      display: none !important
    }

    @media(min-width:1700px) {
      main {
        padding: 35px 65px 25px
      }

      .stage svg {
        max-width: 1250px;
        max-height: 800px
      }

      .profile strong {
        font-size: 13px
      }

      .profile small {
        font-size: 11px
      }
    }

    @media(max-width:1000px) {
      .app {
        grid-template-columns: 240px minmax(0, 1fr)
      }

      main {
        padding: 23px 22px 18px
      }

      .caption {
        display: block
      }

      .caption strong {
        display: block;
        margin-bottom: 3px
      }

      .stage {
        min-height: 300px
      }

      .settings {
        gap: 10px
      }

      .settings label {
        font-size: 11px
      }

      .head-actions button {
        font-size: 11px
      }

      .bottomline>span {
        max-width: 190px
      }

      .diagram-sub {
        font-size: 19px
      }
    }

    @media(max-width:700px) {

      .app,
      .presentation .app {
        grid-template-columns: 1fr
      }

      aside {
        display: none;
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: 285px;
        z-index: 10;
        box-shadow: 10px 0 70px #0002
      }

      body.show-menu aside {
        display: flex
      }

      .mobile-menu {
        display: block !important
      }

      .main-head {
        gap: 10px
      }

      main,
      .presentation main {
        padding: 20px 16px 16px
      }

      h1,
      .presentation h1 {
        font-size: 27px
      }

      .meta {
        font-size: 11px
      }

      .head-actions {
        gap: 4px
      }

      .head-actions button {
        padding: 6px 8px
      }

      .eyebrow {
        font-size: 9px
      }

      .stage {
        min-height: 270px
      }

      .stage svg {
        max-height: 540px
      }

      .settings .local-hint {
        display: none
      }

      .caption span,
      .presentation .caption span {
        font-size: 12px
      }

      .caption strong,
      .presentation .caption strong {
        font-size: 14px
      }

      .bottomline {
        font-size: 9px;
        gap: 10px
      }

      .legend {
        gap: 6px
      }

      .diagram-title {
        font-size: 32px
      }

      .diagram-sub {
        font-size: 21px
      }

      .diagram-small {
        font-size: 16px
      }

      .diagram-note {
        font-size: 17px
      }

      .menu-backdrop {
        position: fixed;
        inset: 0;
        z-index: 9;
        background: #0003
      }

      dialog {
        padding: 20px
      }

      .presentation .profile strong {
        font-size: 12px
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        transition: none !important;
        animation: none !important
      }
    }

    /* Normal document scrolling; explicit SVG proportions avoid percentage-height
   sizing loops in Safari's grid/flex layout. */
    html {
      height: auto;
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto
    }

    body {
      height: auto;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: visible
    }

    .app {
      height: auto;
      min-height: 100vh;
      min-height: 100dvh;
      align-items: start
    }

    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
      align-self: start
    }

    .side-head,
    .side-footer {
      flex-shrink: 0
    }

    .profiles {
      flex: 1 1 0;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y
    }

    main {
      display: block;
      height: auto;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: visible;
      min-width: 0
    }

    .stage {
      display: block;
      min-height: 0;
      height: auto;
      width: 100%;
      margin: 14px auto;
      max-width: 1100px
    }

    .stage svg {
      display: block;
      width: 100%;
      height: auto;
      max-width: none;
      max-height: none;
      overflow: hidden;
      aspect-ratio: 1000 / 620
    }

    .footer {
      margin-top: 12px
    }

    dialog {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain
    }

    @media(min-width:1700px) {
      .stage {
        max-width: 1250px
      }

      .stage svg {
        max-width: none;
        max-height: none
      }
    }

    @media(max-width:1000px) {
      .stage {
        min-height: 0
      }
    }

    @media(max-width:700px) {
      aside {
        position: fixed;
        top: 0;
        bottom: 0;
        height: 100vh;
        height: 100dvh
      }

      .stage {
        min-height: 0;
        margin: 20px 0
      }

      .stage svg {
        height: auto;
        max-height: none
      }

      .app {
        min-height: 100vh;
        min-height: 100dvh
      }
    }


    /* Optional component cards: the base architecture view remains unchanged. */
    .caption .fit-button {
      margin-left: auto;
      flex-shrink: 0;
      font-size: 11px;
      color: #006bd3;
      background: #f8fbff;
      border-color: #dce6f3;
      white-space: nowrap
    }

    #componentDetails {
      width: min(680px, 94vw);
      padding: 25px 28px
    }

    #componentDetails h2 {
      font-size: 25px;
      padding-right: 25px;
      margin: 0 0 5px
    }

    #componentKicker {
      font-size: 13px;
      color: #7b7b85;
      margin: 0 0 18px;
      line-height: 1.5
    }

    .quick-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin: 17px 0 22px
    }

    .quick-stat {
      background: #f4f6f9;
      border: 1px solid #e8ebef;
      border-radius: 11px;
      padding: 13px 10px;
      min-width: 0
    }

    .quick-stat strong {
      display: block;
      font-weight: 550;
      font-size: 19px;
      letter-spacing: -.5px;
      line-height: 1.3;
      overflow-wrap: anywhere
    }

    .quick-stat span {
      font-size: 10px;
      color: #8a8d96;
      display: block;
      margin-top: 4px
    }

    #componentDetails .insight-section h3 {
      font-size: 11px;
      letter-spacing: .2px;
      margin: 15px 0 4px;
      color: #647a92
    }

    #componentDetails .insight-section p {
      font-size: 13px;
      line-height: 1.6;
      margin: 0;
      color: #4d5360
    }

    #componentDetails .insight-why {
      border-top: 1px solid #eceef2;
      margin-top: 17px;
      padding-top: 1px
    }

    #componentDetails .peak-note {
      font-size: 10px;
      line-height: 1.6;
      color: #92949e;
      margin: 15px 0 0
    }

    .term-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      border-top: 1px solid #eceef2;
      padding-top: 14px;
      margin-top: 17px
    }

    .term-buttons button {
      font-size: 10px;
      background: #f8f9fb;
      color: #6c7a90;
      padding: 5px 8px;
      border-color: #e5e8ee
    }

    #componentDetails .term-explanation {
      font-size: 12px;
      background: #eef4fc;
      border-radius: 9px;
      padding: 12px;
      color: #4c6685
    }

    .node-link-button {
      border: 0;
      padding: 0;
      background: transparent;
      color: #006bd3;
      font-size: 11px;
      margin: 15px 0 0
    }

    .card-source {
      margin-top: 14px;
      font-size: 11px
    }

    @media(max-width:1000px) {
      .caption .fit-button {
        margin-top: 10px
      }
    }

    @media(max-width:650px) {
      #componentDetails {
        padding: 21px
      }

      .quick-stats {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }

      .quick-stat strong {
        font-size: 19px
      }

      .caption .fit-button {
        font-size: 10px
      }
    }


    /* Component selection updates the footer in place; no modal or focus jump. */
    #componentDetails {
      width: 100%;
      max-width: none;
      padding: 16px 18px;
      margin: 15px 0 17px;
      border: 1px solid #e4e8ef;
      border-radius: 14px;
      background: #f9fafc;
      box-shadow: none;
      position: static;
      color: var(--ink)
    }

    #componentDetails h2 {
      font-size: 18px;
      margin: 0 0 3px;
      padding-right: 30px;
      letter-spacing: -.4px;
      font-weight: 550
    }

    #componentKicker {
      font-size: 11px;
      margin: 0 0 12px
    }

    .close-inline {
      float: right;
      padding: 0 4px;
      font-size: 21px;
      line-height: 1;
      border: 0;
      color: #8c95a3;
      background: transparent
    }

    #componentDetails .quick-stats {
      margin: 10px 0 15px;
      gap: 8px
    }

    #componentDetails .quick-stat {
      background: #fff;
      padding: 10px 12px
    }

    #componentDetails .quick-stat strong {
      font-size: 18px
    }

    .insight-columns {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px
    }

    #componentDetails .insight-section h3 {
      margin: 0 0 5px;
      font-size: 10px
    }

    #componentDetails .insight-section p {
      font-size: 12px;
      line-height: 1.6
    }

    #componentDetails .insight-why {
      margin: 0;
      padding: 0;
      border: 0
    }

    #componentDetails .extra-insight {
      margin-top: 14px;
      border-top: 1px solid #e6eaf0;
      padding-top: 10px;
      color: #7c8799;
      font-size: 11px
    }

    #componentDetails .extra-insight summary {
      cursor: pointer;
      width: max-content
    }

    #componentDetails .term-buttons {
      margin-top: 12px;
      padding-top: 0;
      border: 0
    }

    @media(max-width:850px) {
      .insight-columns {
        grid-template-columns: 1fr;
        gap: 13px
      }

      #componentDetails {
        padding: 14px
      }

      #componentDetails .quick-stats {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }
    }


    .variant-switch {
      display: flex;
      gap: 3px;
      align-items: center;
      padding: 3px;
      background: #f1f3f6;
      border: 1px solid #e2e5eb;
      border-radius: 9px
    }

    .variant-switch button {
      font-size: 11px;
      border: 0;
      border-radius: 6px;
      padding: 5px 13px;
      background: transparent;
      color: #85858f
    }

    .variant-switch button[aria-pressed=true] {
      background: #fff;
      color: #0868cc;
      box-shadow: 0 1px 4px #0001
    }

    .variant-switch button:disabled {
      opacity: .3;
      cursor: default
    }

    @media(max-width:700px) {
      .variant-switch button {
        padding: 5px 10px
      }
    }
  </style>
</head>

  <div class="app">
    <aside aria-label="Hardware configurations">
      <div class="side-head">
        <div class="brand"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="5" y="5" width="14" height="14" rx="4" stroke="#7b8799" stroke-width="1.4" />

          </svg>Compute Atlas</div>
        <div class="side-sub"></div><input id="search" class="search" placeholder="Find a chip or node…"
          aria-label="Search configurations or individual node names">
        <div class="filters" aria-label="Filter configurations"><button data-filter="all" class="active"
            aria-pressed="true">All</button><button data-filter="local" aria-pressed="false">Local</button><button
            data-filter="icer" aria-pressed="false">ICER</button></div>
      </div>
      <nav class="profiles" id="profiles" aria-label="Choose a configuration"></nav>
      <div class="side-footer"><span id="profileCount">45 configurations</span><span>Oct 2026</span></div>
    </aside>
    <main>
      <div class="main-head">
        <div>
          <div class="eyebrow" id="location">Local machines</div>
          <h1 id="title">Intel</h1>
          <div class="meta" id="meta">Generic local configuration</div>
        </div>
        <div class="head-actions"><button class="mobile-menu" id="menu"
            aria-label="Choose configuration">☰</button><button class="info" id="info"
            aria-label="Configuration details and sources">i</button><button id="present">⛶ Present</button></div>
      </div>
      <div class="settings"><span class="architecture" id="isa">x86-64</span>
        <div id="localOptions"><label><input id="igpu" type="checkbox" checked> Integrated GPU</label>　<label><input
              id="npu" type="checkbox"> NPU</label>　<label><input id="dgpu" type="checkbox"> Separate GPU</label></div>
        <div id="appleOptions" class="variant-switch" role="group" aria-label="Apple chip variant" hidden></div><span
          id="summaryCount" class="node-count"></span>
      </div>
      <div class="stage" id="stage" aria-label="Architecture diagram"></div>
      <footer class="footer">
        <div class="caption" aria-live="polite"><strong id="captionTitle">CPU</strong><span id="captionText">Runs code
            and prepares data.</span><button class="fit-button" id="machineFit">Machine fit ↗</button></div>
        <section id="componentDetails" class="inline-component" aria-label="Selected component information" hidden>
          <button class="close-inline" id="closeComponent" aria-label="Hide component information">×</button>
          <h2 id="componentTitle"></h2>
          <p id="componentKicker"></p>
          <div id="componentBody"></div>
        </section>
        <div class="bottomline">
          <div class="legend"><span><i style="--color:var(--cpu)"></i>CPU</span><span><i
                style="--color:var(--gpu)"></i>GPU</span><span><i style="--color:var(--npu)"></i>AI
              accelerator</span><span><i style="--color:var(--ram)"></i>Memory</span></div>
          <div class="top-right"><span>Conceptual layout · not to scale</span>
            <div class="pager"><button id="prev" aria-label="Previous configuration"
                title="Previous (←)">‹</button><button id="next" aria-label="Next configuration"
                title="Next (→)">›</button></div>
          </div>
        </div>
      </footer>
    </main>
  </div>
  <div class="menu-backdrop" id="menuBackdrop" hidden></div>
