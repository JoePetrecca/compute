<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="An interactive reference for local and ICER compute hardware.">
  <title>Compute Atlas</title>
  <link rel="stylesheet" href="styles/atlas.css">
</head>

<body>
  <div class="app">
    <aside>
      <header class="sidebar-header">
        <a class="brand" href="./" aria-label="Compute Atlas home"><svg viewBox="0 0 24 24" fill="none"
            aria-hidden="true">
            <rect x="5" y="5" width="14" height="14" rx="4" stroke="#7b8799" stroke-width="1.4" />
            <rect x="9" y="9" width="6" height="6" rx="1.5" fill="#b7cce5" />
            <path d="M9 2v3m6-3v3M9 19v3m6-3v3M2 9h3m-3 6h3M19 9h3m-3 6h3" stroke="#7b8799" stroke-width="1.4" />
          </svg> Compute Atlas</a>
        <label class="search"><input id="search" type="search" placeholder="Find a chip or node…"
            aria-label="Find a computer" autocomplete="off"></label>
        <div id="sidebar-mode-controls" class="view-switch sidebar-mode" role="group" aria-label="Sidebar subtitle style">
          <button type="button" data-sidebar-mode="workload" aria-pressed="true">Workload</button>
          <button type="button" data-sidebar-mode="specs" aria-pressed="false">Specs</button>
        </div>
      </header>
      <nav id="computer-list" aria-label="Computers">
        <p class="loading">Loading computers…</p>
      </nav>
      <footer id="profile-count">Loading configurations…</footer>
    </aside>
    <main>
      <header class="page-header">
        <div>
          <p class="eyebrow" id="computer-group"></p>
          <h1 id="computer-name">Compute Atlas</h1>
          <p class="summary" id="computer-summary"></p>
        </div>
        <button id="details-button" class="secondary info" aria-label="Configuration details and sources">i</button>
      </header>
      <section id="controls" class="controls" hidden aria-label="Local machine options">
        <span class="architecture" id="architecture"></span>
        <label><input id="integrated-gpu" type="checkbox" checked> Integrated GPU</label>
        <label><input id="npu" type="checkbox"> AI accelerator</label>
        <label><input id="discrete-gpu" type="checkbox"> Separate GPU</label>
      </section>
      <div id="diagram-view-controls" class="diagram-view-controls" hidden>
        <span>Diagram view</span>
        <div class="view-switch" role="group" aria-label="Diagram detail level">
          <button type="button" data-diagram-view="simple" aria-pressed="true">Simple</button>
          <button type="button" data-diagram-view="detailed" aria-pressed="false">Detailed</button>
        </div>
      </div>
      <section id="diagram" class="diagram" aria-label="Hardware architecture diagram"></section>
      <div id="machine-tabs" class="machine-tabs" role="tablist" aria-label="Machine information" hidden>
        <button id="specs-tab" type="button" role="tab" aria-selected="true" aria-controls="inspector" data-machine-tab="specs">Machine specs</button>
        <button id="usage-tab" type="button" role="tab" aria-selected="false" aria-controls="usage-panel" tabindex="-1" data-machine-tab="usage">How to use this computer</button>
      </div>
      <section id="inspector" class="inspector" aria-live="polite">
        <p class="eyebrow">Select a component</p>
        <h2>Explore the diagram</h2>
        <p>Click a CPU, GPU, memory pool, or connection to see what it represents.</p>
      </section>
      <section id="usage-panel" class="inspector usage-panel" role="tabpanel" aria-labelledby="usage-tab" hidden></section>
      <footer class="main-footer"><span><i class="cpu"></i>CPU <i class="gpu"></i>GPU <i class="memory"></i>Memory <i
            class="accelerator"></i>AI accelerator</span><span>Conceptual layout · not to scale</span></footer>
    </main>
  </div>
  <dialog id="details-dialog"><button id="close-dialog" class="close" aria-label="Close">×</button>
    <p class="eyebrow">Configuration details</p>
    <h2 id="dialog-title"></h2>
    <div id="dialog-content"></div>
  </dialog>
  <script type="module" src="scripts/app.js"></script>
</body>

</html>
